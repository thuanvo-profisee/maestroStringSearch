name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Check that the tag matches the manifest version
        run: |
          version=$(node -p "require('./public/manifest.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match manifest version $version"
            exit 1
          fi

      - run: npm ci
      - run: npm run build

      - name: Package the extension
        run: cd dist && zip -r "../maestro-strings-search-$GITHUB_REF_NAME.zip" .

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "maestro-strings-search-$GITHUB_REF_NAME.zip" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
